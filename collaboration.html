<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Postdim - Collaboration</title>
  <link rel="stylesheet" href="./css/collab-app.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body class="collab-mode">

<!-- ================= SIDEBAR ================= -->
<aside id="sidebar">

  <!-- ================= HEADER ================= -->
  <div class="collab-header">
    <h3>Collaboration Mode</h3>

    <div id="collabUserBar" class="user-bar">
      <span id="collabUserEmail"></span>
      <button id="collabLogoutBtn">Logout</button>
    </div>
  </div>



  <!-- ================= WORKSPACE ACTIVE (TOP DISPLAY) ================= -->
  <div id="activeWorkspaceBox" class="workspace-active">
    <div class="workspace-title">
      <span id="activeWorkspaceName">No Workspace</span>
    </div>
  </div>

  

  <!-- ================= WORKSPACE SWITCHER ================= -->
  <label style="font-size:12px; opacity:0.7;">Switch Workspace</label>

  <select id="workspaceSwitcher" style="width:100%; margin-top:5px;">
    <option>Loading...</option>
  </select>

  <div class="action-menu" style="margin-top: auto; padding: 10px;">
    <button id="mainActionBtn" class="btn-fab">+</button>
  
    <div id="actionDropdown" class="action-dropdown">
      <button id="createWorkspaceBtn">New Workspace</button>
      <button id="newCollection">New Collection</button>
      <button id="addRequest">New Request</button>
    </div>
  </div>

  <!-- ================= COLLECTION LIST ================= -->
  <div id="collectionList"></div>

 

  <!-- ================= VARIABLES ================= -->
  <button id="openEnvModal">Variables</button>

  <!-- ================= EXPORT / IMPORT ================= -->
  <div style="margin-top:20px;">
    <button id="exportBtn">Export</button>
    <input type="file" id="importFile">
  </div>



  <!-- ================= INVITE ================= -->
  <button id="inviteBtn">Invite User</button>

</aside>

<!-- ================= MAIN ================= -->
<main class="container">

  <h2>Postdim (Collaboration)</h2>

  <!-- ================= TABS ================= -->
  <div class="topbar">
    <div id="tabs" class="tabs-container"></div>
    <button id="newTab">+ Tab</button>
  </div>

  <!-- ================= REQUEST BAR ================= -->
  <div class="request-bar">
    <select id="method">
      <option>GET</option>
      <option>POST</option>
      <option>PUT</option>
      <option>PATCH</option>
      <option>DELETE</option>
      <option>HEAD</option>
      <option>OPTIONS</option>
    </select>

    <input id="url" placeholder="https://api.example.com" />
    <div class="proxy-container">
      <input type="checkbox" id="use-proxy">
      <label for="use-proxy">Proxy</label>
    </div>
  </div>

  <button id="send">Send Request</button>

  <!-- ================= REQUEST TABS ================= -->
  <div id="reqTabs" class="req-tabs">
    <span class="req-tab active" data-tab="params">Params</span>
    <span class="req-tab" data-tab="body">Body</span>
    <span class="req-tab" data-tab="headers">Headers</span>
    <span class="req-tab" data-tab="auth">Auth</span>
    <span class="req-tab" data-tab="scripts">Scripts</span>
  </div>

  <!-- ================= CONTENT ================= -->
  <div id="reqContent">

    <div class="tab-panel" data-panel="params">
      <div id="paramsBox"></div>
      <button id="addParam">+ Param</button>
    </div>

    <div class="tab-panel hidden" data-panel="body">
      <div class="body-tabs">
        <button class="body-tab active" data-mode="none">none</button>
        <button class="body-tab" data-mode="raw">raw</button>
        <button class="body-tab" data-mode="form-data">form-data</button>
        <button class="body-tab" data-mode="urlencoded">x-www-form-urlencoded</button>
      </div>

      <div id="rawBodyBox">
        <textarea id="body"></textarea>
      </div>

      <div id="formDataBox" class="hidden">
        <div id="formDataList"></div>
        <button id="addFormData">+ Add Field</button>
      </div>

      <div id="urlencodedBox" class="hidden">
        <div id="urlencodedList"></div>
        <button id="addUrlEncoded">+ Add Field</button>
      </div>
    </div>

    <div class="tab-panel hidden" data-panel="headers">
      <div id="headersBox"></div>
      <button id="addHeader">+ Header</button>
    </div>

    <div class="tab-panel hidden" data-panel="auth">
      <select id="authType">
        <option value="none">No Auth</option>
        <option value="bearer">Bearer</option>
        <option value="apiKey">API Key</option>
      </select>
      <input id="authValue" placeholder="token / key">
    </div>

    <div class="tab-panel hidden" data-panel="scripts">
      <div class="script-section">
        <div class="script-header">Pre Script</div>
        <div id="preEditor" class="monaco-editor"></div>
      </div>

      <div class="script-section">
        <div class="script-header">Post Script</div>
        <div id="postEditor" class="monaco-editor"></div>
      </div>
    </div>

  </div>

  <div id="statusBar"></div>


  <div id="responseTabs" class="response-tabs">

  <span class="response-tab active"
        data-tab="body">
    Body
  </span>

    <span class="response-tab"
        data-tab="cookies">
    Cookies
  </span>

  <span class="response-tab"
        data-tab="headers">
    Headers
  </span>



</div>

  <div id="viewToggle" class="toggle">
    <span class="opt active" data-mode="raw">Raw</span>
    <span class="opt" data-mode="tree">Tree</span>
  </div>

  <div id="response"></div>

</main>

<!-- ================= ENV PANEL ================= -->
<div id="envPanel" class="env-panel hidden">

  <div class="env-header">
    <h3>Workspace Variables</h3>
    <button id="closeEnvPanel">✕</button>
  </div>

  <div id="envList" class="env-list"></div>

  <div class="env-form">
    <input id="envKey" placeholder="key">
    <input id="envValue" placeholder="value">
    <button id="addEnv">+ Add</button>
  </div>

</div>

<!-- ================= MONACO ================= -->
<script>
  window.MonacoEnvironment = {
    getWorkerUrl: function () {
      return "./lib/js/monaco-editor/min/vs/base/worker/workerMain.js";
    }
  };

const mainBtn = document.getElementById('mainActionBtn');
const dropdown = document.getElementById('actionDropdown');

mainBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  // Toggle visibility
  dropdown.style.display = (dropdown.style.display === 'block') ? 'none' : 'block';
});

// Menutup menu jika klik area luar
document.addEventListener('click', () => {
  dropdown.style.display = 'none';
});
</script>

<script src="./lib/js/monaco-editor/min/vs/loader.js"></script>

<script type="module" src="./js/collab/collab-app.js"></script>

</body>
</html>
