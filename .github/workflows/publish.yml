name: Release App & Deploy Web

on:
  push:
    tags: [ "v*" ] # Build jalan saat kamu push tag versi baru (misal: v1.0.0)

jobs:
  # 1. Build Desktop Installer
  build-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node & Rust
        uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Tauri
        run: |
          npm install
          cargo tauri build
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: src-tauri/target/release/bundle/msi/*.msi

  # 2. Deploy Web ke GitHub Pages
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.MY_GITHUB_TOKEN }}
          publish_dir: ./www # Folder web 