name: Release App & Deploy Web

on:
  push:
    tags: [ "v*" ]

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      # Instal tauri-cli agar perintah 'cargo tauri' bisa dikenali
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"
        
      # Jika kamu tidak pakai npm, hapus baris npm install. 
      # Jika pakai, pastikan package.json ada di root.
      - name: Build Tauri
        run: cargo tauri build
        
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2 # Gunakan v2 untuk keamanan
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        with:
          files: src-tauri/target/release/bundle/msi/*.msi

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.MY_GITHUB_TOKEN }}
          publish_dir: ./www