name: Release App & Deploy Web

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      # Caching untuk mempercepat build dan menghindari download ulang
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"
        
      - name: Build Tauri
        env:
          CARGO_NET_RETRY: "10"
          CARGO_NET_TIMEOUT: "300"
        run: |
          cd src-tauri
          # Langkah KRUSIAL: Menghapus folder gen agar schema di-generate ulang
          if (Test-Path "gen") { Remove-Item -Recurse -Force "gen" }
          cargo tauri build
        
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  deploy-web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www