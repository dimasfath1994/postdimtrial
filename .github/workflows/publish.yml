name: Release App & Deploy Web

on:
  push:
    tags: [ "v*" ]

jobs:
  build-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        
      # Kita instal tauri-cli agar perintah 'cargo tauri' dikenal
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"
        
      # Kita build langsung tanpa npm install
      # Jika aplikasi butuh build frontend, pastikan langkahnya sesuai
      - name: Build Tauri
        run: cargo tauri build
        
      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        with:
          files: src-tauri/target/release/bundle/msi/*.msi

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.MY_GITHUB_TOKEN }}
          publish_dir: ./www