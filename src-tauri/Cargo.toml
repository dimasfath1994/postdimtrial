[package]
name = "app"
version = "0.1.0"
description = "A Postdim App"
authors = ["dimas"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
base64 = "0.22"

# --- API CLIENT & HTTP ---
reqwest = { version = "0.12", features = ["json", "multipart", "cookies", "rustls-tls"] }
http = "1.0"
tokio-stream = "0.1"

# --- gRPC & PROST ---
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
tokio = { version = "1", features = ["full"] }