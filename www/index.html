<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Postdim</title>
  <link rel="stylesheet" href="./css/app.css">
</head>

<body>

<!-- SIDEBAR -->
<aside id="sidebar">

  <button id="newCollection">+ Collection</button>
  <button id="addRequest">+ Request</button>

  <div id="collectionList"></div>

  <!-- VARIABLES (POSTMAN STYLE) -->
  <button id="openEnvModal" style="margin-top:20px;">
    Variables
  </button>

  <!-- EXPORT / IMPORT -->
  <div style="margin-top:20px;">
    <button id="exportBtn">Export</button>
    <input type="file" id="importFile">
  </div>
  <button id="collabModeBtn" style="margin-top:20px;">
    Collaboration Mode
  </button>


  <div id="collabUserBar" style="display:none; margin-top:10px;">
    <span id="collabUserEmail"></span>
    <button id="collabLogoutBtn" style="margin-top:20px; display:none;">
      Logout
    </button>
  </div>


  <div style="margin-top: auto; padding: 10px; text-align: center;">
    <button id="downloadAppBtn" style="background: none; border: none; color: #888; font-size: 11px; cursor: pointer; text-decoration: underline; opacity: 0.8;">
      💻 Get Desktop App
    </button>
  </div>

</aside>

<!-- MAIN -->
<main class="container">

  <h2>Postdim</h2>

  <!-- TABS -->
  <div class="topbar">
    <div id="tabs" class="tabs-container"></div>
    <button id="newTab">+ Tab</button>
  </div>

  <!-- REQUEST -->
  <div class="request-bar">
    <select id="method">
      <option>GET</option>
      <option>POST</option>
      <option>PUT</option>
      <option value="PATCH">PATCH</option>
      <option>DELETE</option>
      <option>HEAD</option>
      <option>OPTIONS</option>
      <!-- ADDED: gRPC Option -->
      <option value="GRPC">gRPC</option>
    </select>

    <input id="url" placeholder="https://api.example.com" />
    <input type="checkbox" id="use-proxy" name="use-proxy">
    <label for="use-proxy">Use Proxy (Bypass CORS)</label>
  </div>

  <button id="send">Send Request</button>

  <!-- POSTMAN STYLE TABS -->
  <div id="reqTabs" class="req-tabs">
    <span class="req-tab active" data-tab="params">Params</span>
    <span class="req-tab" data-tab="body">Body</span>
    <span class="req-tab" data-tab="headers">Headers</span>
    <span class="req-tab" data-tab="auth">Auth</span>
    <span class="req-tab" data-tab="scripts">Scripts</span>
  </div>

  <!-- DYNAMIC CONTENT -->
  <div id="reqContent">

    <!-- PARAMS -->
    <div class="tab-panel" data-panel="params">
      <div id="paramsBox"></div>
      <button id="addParam">+ Param</button>
    </div>

    <!-- BODY -->
    <div class="tab-panel hidden" data-panel="body">

      <!-- BODY MODE TABS (POSTMAN STYLE) -->
      <div class="body-tabs">

        <button class="body-tab active" data-mode="none">none</button>
        <button class="body-tab" data-mode="raw">raw</button>
        <button class="body-tab" data-mode="form-data">form-data</button>
        <button class="body-tab" data-mode="urlencoded">x-www-form-urlencoded</button>
        <!-- ADDED: GraphQL & gRPC Body Tabs -->
        <button class="body-tab" data-mode="graphql">GraphQL</button>
        <button class="body-tab" data-mode="grpc">gRPC</button>

      </div>

      <!-- RAW BODY -->
      <div id="rawBodyBox">
        <textarea id="body" placeholder="Raw JSON / text"></textarea>
      </div>

      <!-- FORM DATA -->
      <div id="formDataBox" class="hidden">
        <div id="formDataList"></div>
        <input type="file" class="file-input hidden">
        <button class="choose-file">Choose File</button>
        <span class="file-name"></span>
        <button id="addFormData">+ Add Field</button>
      </div>

      <!-- URL ENCODED -->
      <div id="urlencodedBox" class="hidden">
        <div id="urlencodedList"></div>
        <button id="addUrlEncoded">+ Add Field</button>
      </div>

      <!-- ADDED: GRAPHQL BOX -->
      <div id="graphqlBox" class="hidden" style="margin-top: 10px;">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div>
            <div style="font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #ccc;">GraphQL Query / Mutation</div>
            <div id="graphqlQueryEditor" class="monaco-editor" style="height: 180px; border: 1px solid #333;"></div>
            <textarea id="graphqlQuery" class="hidden" placeholder="query { ... }"></textarea>
          </div>
          <div>
            <div style="font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #ccc;">GraphQL Variables (JSON)</div>
            <div id="graphqlVariablesEditor" class="monaco-editor" style="height: 100px; border: 1px solid #333;"></div>
            <textarea id="graphqlVariables" class="hidden" placeholder="{ &quot;id&quot;: 1 }"></textarea>
          </div>
        </div>
      </div>

<!-- ADDED: gRPC BOX -->
<div id="grpcBox" class="hidden" style="margin-top: 10px;">
  <div style="display: flex; flex-direction: column; gap: 12px;">
    
    <!-- Dynamic Reflection Status & Upload Proto -->
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <button id="chooseProtoBtn" type="button">+ Upload .proto</button>
      <input type="file" id="grpcProtoFile" accept=".proto" class="hidden">
      <span id="protoFileName" style="font-size: 12px; color: #aaa;">No .proto loaded</span>
      
      <!-- Status Badge Reflection -->
      <button id="btnFetchReflection" type="button" style="margin-left: auto; font-size: 11px; padding: 3px 8px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px;">
        🔄 Refresh Reflection
      </button>
    </div>

    <!-- Service / Method Input dengan Autocomplete Datalist -->
    <div>
      <input id="grpcServiceMethod" list="grpcServicesList" placeholder="Service/Method (e.g. /helloworld.Greeter/SayHello)" style="width: 100%; padding: 6px;" />
      <!-- Datalist Tempat Hasil Discovery Reflection Dimuat -->
      <datalist id="grpcServicesList"></datalist>
    </div>

    <div>
      <div style="font-size: 12px; font-weight: bold; margin-bottom: 6px; color: #ccc;">JSON Message Body</div>
      <div id="grpcMessageEditor" class="monaco-editor" style="height: 180px; border: 1px solid #333;"></div>
      <textarea id="grpcBody" class="hidden" placeholder='{ "name": "World" }'></textarea>
    </div>
  </div>
</div>

    </div>


    <!-- HEADERS -->
    <div class="tab-panel hidden" data-panel="headers">
      <div id="headersBox"></div>
      <button id="addHeader">+ Header</button>
    </div>

    <!-- AUTH -->
    <div class="tab-panel hidden" data-panel="auth">
      <h4>Auth</h4>
      <select id="authType">
        <option value="none">No Auth</option>
        <option value="bearer">Bearer</option>
        <option value="apiKey">API Key</option>
      </select>
      <input id="authValue" placeholder="token / key">
    </div>

    <!-- SCRIPTS (MONACO VERSION) -->
    <div class="tab-panel hidden" data-panel="scripts">

      <div class="script-section">

        <div class="script-header">Pre Script</div>
        <div id="preEditor" class="monaco-editor"></div>

      </div>

      <div class="script-section">

        <div class="script-header">Post Script</div>
        <div id="postEditor" class="monaco-editor"></div>

      </div>

    </div>

  </div>

  <!-- STATUS -->
  <div id="statusBar"></div>


  <div id="responseTabs" class="response-tabs">

    <span class="response-tab active" data-tab="body">
      Body
    </span>

    <span class="response-tab" data-tab="cookies">
      Cookies
    </span>

    <span class="response-tab" data-tab="headers">
      Headers
    </span>

  </div>

  <!-- VIEW TOGGLE -->
  <div id="viewToggle" class="toggle">
    <span class="opt active" data-mode="raw">Raw</span>
    <span class="opt " data-mode="tree">Tree</span>
  </div>

  <!-- RESPONSE -->
  <div id="responsePanels">

    <div id="responseBody" class="response-panel"></div>

    <div id="responseHeaders" class="response-panel hidden"></div>

    <div id="responseCookies" class="response-panel hidden"></div>

  </div>

</main>

<!-- ================= ENV SIDE PANEL ================= -->
<div id="envPanel" class="env-panel hidden">

  <div class="env-header">
    <h3>Variables</h3>
    <button id="closeEnvPanel">✕</button>
  </div>

  <div id="envList" class="env-list"></div>

  <div class="env-form">
    <input id="envKey" placeholder="key">
    <input id="envValue" placeholder="value">
    <button id="addEnv">+ Add</button>
  </div>

</div>

<script>
  window.MonacoEnvironment = {
    getWorkerUrl: function () {
      return "./lib/js/monaco-editor/min/vs/base/worker/workerMain.js";
    }
  };
</script>

<script src="./lib/js/monaco-editor/min/vs/loader.js"></script>
<script type="module" src="./js/app.js"></script>

</body>
</html>
